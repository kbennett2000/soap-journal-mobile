<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SOAP Journal — Offline Scripture journaling and Bible reader for Android">
  <defs>
    <linearGradient id="ink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="48%" stop-color="#111a2b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="warm" cx="40%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#e0ab57" stop-opacity="0.20"/>
      <stop offset="42%" stop-color="#c8923f" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#c8923f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground -->
  <rect width="1200" height="360" fill="url(#ink)"/>
  <rect width="1200" height="360" fill="url(#warm)"/>

  <!-- editorial double rule -->
  <rect x="20" y="20" width="1160" height="320" rx="3" fill="none" stroke="#c9a24a" stroke-opacity="0.45" stroke-width="1.25"/>
  <rect x="27" y="27" width="1146" height="306" rx="2" fill="none" stroke="#c9a24a" stroke-opacity="0.18" stroke-width="1"/>

  <!-- open-book motif (line art, gold) -->
  <g transform="translate(118,180)" stroke="#d9b25e" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- left page -->
    <path d="M 0,-52 C -32,-66 -58,-64 -72,-54 L -72,52 C -58,42 -32,40 0,54 Z" fill="#e8c873" fill-opacity="0.05"/>
    <!-- right page -->
    <path d="M 0,-52 C 32,-66 58,-64 72,-54 L 72,52 C 58,42 32,40 0,54 Z" fill="#e8c873" fill-opacity="0.05"/>
    <!-- spine -->
    <line x1="0" y1="-52" x2="0" y2="54"/>
    <!-- faint text lines -->
    <g stroke-width="1.4" stroke-opacity="0.5">
      <line x1="-58" y1="-32" x2="-14" y2="-26"/>
      <line x1="-58" y1="-14" x2="-14" y2="-8"/>
      <line x1="-58" y1="4" x2="-14" y2="10"/>
      <line x1="14" y1="-26" x2="58" y2="-32"/>
      <line x1="14" y1="-8" x2="58" y2="-14"/>
      <line x1="14" y1="10" x2="58" y2="4"/>
    </g>
    <!-- ribbon bookmark -->
    <path d="M 0,-52 L 0,86 L 8,76 L 16,86 L 16,-50" stroke="#b98a3a" stroke-width="2" fill="#0b1220" fill-opacity="0"/>
  </g>

  <!-- wordmark -->
  <text x="290" y="166" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="0.5">
    <tspan fill="#e7c878">SOAP</tspan><tspan fill="#f3ecdd" dx="18">Journal</tspan>
  </text>

  <!-- gold rule under wordmark -->
  <line x1="293" y1="196" x2="430" y2="196" stroke="#c9a24a" stroke-opacity="0.8" stroke-width="2"/>

  <!-- tagline -->
  <text x="293" y="232" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" letter-spacing="0.4" fill="#c5cdda">Offline Scripture journaling &amp; a Bible reader for Android</text>

  <!-- SOAP expansion (small caps feel via tracking) -->
  <text x="294" y="272" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" letter-spacing="2.6" fill="#9f8a5e">SCRIPTURE&#160;&#160;·&#160;&#160;OBSERVATION&#160;&#160;·&#160;&#160;APPLICATION&#160;&#160;·&#160;&#160;PRAYER</text>
</svg>
