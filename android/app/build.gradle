apply plugin: 'com.android.application'

// Release signing is driven by a gitignored android/keystore.properties (keys:
// storeFile, storePassword, keyAlias, keyPassword). When that file is absent —
// debug builds, CI, and contributors without the keystore — the release
// signingConfig is skipped and `assembleRelease` still succeeds (producing an
// unsigned APK). No secrets live in the repo.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace = "com.kbennett.soapjournal"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kbennett.soapjournal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // App version. EVERY release MUST bump versionCode (1 → 2 → 3 …) or Android
        // will refuse to install the new APK over an existing one. versionName is the
        // human SemVer shown to users (e.g. "1.1.0"); always sign releases with the
        // same keystore.
        versionCode 2
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Defined only when keystore.properties is present; otherwise release
        // builds remain unsigned rather than failing.
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                // minSdk 24 makes AGP auto-disable the legacy v1 (JAR) signature, producing a
                // v2-only APK that some on-device installers (notably Samsung) reject via
                // tap-to-install ("App not installed"). Force BOTH so sideloads work everywhere.
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        release {
            // Keep code/resource shrinking OFF: a sideload release must retain the
            // @capacitor-community/sqlite native lib and the bundled ~75MB Bible
            // asset. (Assets aren't code-shrunk regardless; this is belt-and-braces.)
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    // No ABI splits: one universal APK ships all architectures (users never pick one).
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
